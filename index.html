<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emkay Dev – teach Emkay something new</title>
<meta name="description" content="Make an OpenVoiceOS skill for Emkay and hear it answer – with blocks or with code. The same skill, the same Emkay. Nothing to install.">
<meta name="theme-color" content="#05070a">
<meta property="og:title" content="Emkay Dev – teach Emkay something new">
<meta property="og:description" content="Make an OpenVoiceOS skill for Emkay – with blocks (Emkay Blocks) or with code (Emkay Code). Nothing to install.">
<meta property="og:image" content="https://emkay.ai/emkay.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
// The VS Code page was here until it moved to code/: its old links go on there
(() => {
  const old = ["browser", "github", "watch", "gallery", "fork", "store", "help"];
  if (old.includes(location.hash.slice(1))) location.replace("code/" + location.search + location.hash);
})();
</script>
<style>
  :root { --bg: #05070a; --card: #141b24; --ink: #fff; --muted: #8a96a8; --line: #232c38;
          --accent: #22a7f0; --accent-strong: #1478c8; --soft: #c7d0dc; --good: #4cd38a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  code, kbd { font: 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: #1b2430;
              border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: #fff; }
  kbd { border-bottom-width: 2px; }
  main { max-width: 1040px; margin: 0 auto; padding: 0 22px 60px; }

  .top { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; }
  .top a.home { color: var(--muted); text-decoration: none; font-size: 14px; letter-spacing: .25em; }
  .top select { background: var(--card); color: var(--soft); border: 1px solid var(--line);
                border-radius: 20px; padding: 6px 12px; font: inherit; font-size: 14px; }

  .hero { display: grid; grid-template-columns: .95fr 1.05fr; gap: 36px; align-items: center; padding: 30px 0 18px; }
  h1 { font-weight: 300; letter-spacing: .3em; font-size: 44px; margin: 0; }
  h1 span { color: var(--accent); }
  .tag { color: var(--soft); margin: 14px 0 28px; font-size: 21px; line-height: 1.45; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .open { display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
          padding: 14px 30px; border-radius: 40px; font-size: 17px; }
  .open:hover { background: var(--accent-strong); }
  .open.ghost { background: #1b2430; }
  .open.ghost:hover { background: #253142; }
  .open.small { padding: 9px 20px; font-size: 15px; }
  .card p.small { color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 16px; }
  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; text-align: center; padding-top: 16px; }
    .buttons { justify-content: center; }
  }

  /* the little demo: an editor and Emkay next to it (script below) */
  .demo { width: 100%; filter: drop-shadow(0 30px 50px rgba(0, 0, 0, .6)); }
  .demo .code { font: 13px ui-monospace, Menlo, Consolas, monospace; fill: #d4d4d4; }
  .demo .code .k { fill: #569cd6; } .demo .code .s { fill: #ce9178; } .demo .code .f { fill: #dcdcaa; }
  .demo .code .c { fill: #6a9955; } .demo .code .new { fill: #fff; }
  .demo .tabtxt { font: 12px system-ui, sans-serif; fill: #ccc; }
  .demo .status { font: 12px system-ui, sans-serif; fill: #fff; }
  .demo .eye { transform-box: fill-box; transform-origin: center; transition: transform .12s ease-out; }
  .demo.blink .eye { transform: scaleY(.08); }
  .demo.thinking .eye { transform: scaleY(.62); }
  .demo.happy .eye { transform: scale(1.12); }
  .demo .caption { font: 13px system-ui, sans-serif; fill: var(--soft); }
  .demo .caption.said { fill: #fff; }
  .demo .cursor { animation: blinkc 1s steps(1) infinite; }
  @keyframes blinkc { 50% { opacity: 0; } }
  .demo .saved { opacity: 0; transition: opacity .3s; }
  .demo.saved .saved { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .demo .cursor { animation: none; } }

  h2 { font-weight: 500; font-size: 24px; margin: 48px 0 12px; }
  .lead { color: var(--soft); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 22px; }
  .card.watch { display: flex; gap: 22px; align-items: flex-start; padding: 18px 22px; }
  .card.watch img { width: 240px; height: auto; border-radius: 14px; flex: none; }
  .card.watch p { margin: 0 0 12px; }
  @media (max-width: 640px) { .card.watch { flex-direction: column; align-items: center; } }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .cards .card { padding: 16px 20px; display: flex; flex-direction: column; }
  .cards h3 { margin: 0 0 6px; font-size: 17px; }
  .cards p { margin: 0 0 10px; color: var(--soft); font-size: 15px; }
  .cards .icon { font-size: 26px; line-height: 1; margin-bottom: 8px; }
  .cards .card .open { margin-top: auto; align-self: flex-start; }
  .num { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: var(--accent);
         color: #fff; align-items: center; justify-content: center; font-weight: 600; margin-bottom: 10px; }
  .say { color: #fff; font-style: italic; }
  ol.steps { padding-left: 0; list-style: none; counter-reset: s; }
  ol.steps > li { counter-increment: s; position: relative; padding: 10px 0 10px 46px; border-bottom: 1px solid var(--line); }
  ol.steps > li:last-child { border-bottom: 0; }
  ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: 10px; width: 30px; height: 30px;
                          border-radius: 50%; background: #1b2430; border: 1px solid var(--accent);
                          display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .copy { cursor: pointer; }
  .copy::after { content: " ⧉"; color: var(--muted); }
  .copy.done::after { content: " ✓"; color: var(--good); }
  .files { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .file { background: #0d1116; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .file .name { background: #1b2430; padding: 6px 12px; font: 13px ui-monospace, Menlo, monospace; color: var(--soft); overflow-wrap: anywhere; }
  .file pre { margin: 0; padding: 10px 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; color: #d4d4d4; white-space: pre-wrap; }
  .file p { margin: 0; padding: 0 12px 12px; color: var(--muted); font-size: 14px; }
  .tpl .meta { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .tpl.soon { border-style: dashed; }
  /* See my skill: the gallery (tools/build_gallery.mjs) */
  .gal .who { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .gal .who img { width: 22px; height: 22px; border-radius: 50%; }
  .gal .tag { display: inline-block; font-size: 12px; color: #e8c27a; border: 1px solid #6b5a33; border-radius: 99px; padding: 1px 8px; margin-left: auto; }
  .gal .ex { color: #fff; font-style: italic; }
  .gal .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .gal-empty { color: var(--muted); }
  .gal-all { margin: 16px 0 18px; }
  .help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .help-grid { grid-template-columns: 1fr; } }
  .card.help { padding: 6px 22px 14px; }
  .card.help h3 { margin: 14px 0 6px; font-size: 18px; }
  .card.help ul { margin: 0; padding-left: 20px; }
  .card.help li { margin: 0 0 10px; color: var(--soft); }
  .card.help .small { margin: 0 0 6px; }
  footer { color: var(--muted); font-size: 14px; text-align: center; margin-top: 56px; }

  /* the two ways (emkay-voice/dev#4) */
  .ways { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 8px; }
  @media (max-width: 760px) { .ways { grid-template-columns: 1fr; } }
  .way { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 26px 24px;
         display: flex; flex-direction: column; }
  .way .big { font-size: 46px; line-height: 1; }
  .way h2 { margin: 14px 0 0; font-size: 26px; }
  .way .name { color: var(--accent); letter-spacing: .2em; font-size: 13px; text-transform: uppercase; margin: 4px 0 10px; }
  .way p { color: var(--soft); margin: 0 0 20px; }
  .way .open { margin-top: auto; align-self: flex-start; }
  .between { text-align: center; color: var(--soft); max-width: 760px; margin: 34px auto 0; }
  .between h3 { color: #fff; font-weight: 500; font-size: 20px; margin: 0 0 8px; }
  .arrows { font-size: 28px; color: var(--accent); letter-spacing: .3em; }
  .more p { margin: 0 0 12px; color: var(--soft); }
  .hero.solo { grid-template-columns: 1fr; text-align: center; padding-bottom: 26px; }
  .hero.solo .tag { max-width: 760px; margin-left: auto; margin-right: auto; }

  .free { display: inline-block; margin: 6px auto 0; padding: 10px 18px; border: 1px solid #1f4f6e; background: #0b1a24; border-radius: 40px; color: #fff; font-size: 16px; }
  .free::before { content: "✓ "; color: var(--good); }
</style>
</head>
<body>
<main>
<div class="top">
  <a class="home" href="https://emkay.ai/">EMKAY</a>
  <select id="lang" aria-label="Language"></select>

<section class="hero solo">
  <div>
    <h1>EMKAY <span>DEV</span></h1>

  <div class="way">

</div>

<h2 data-t="hub_more_h"></h2>
<div class="cards more">
  <div class="card"><div class="icon">✨</div><p data-t="hub_gallery_p"></p>
    <a class="open small ghost" href="gallery/" data-t="hub_open"></a></div>
  <div class="card"><div class="icon">🛍️</div><p data-t="hub_store_p"></p>
    <a class="open small ghost" href="https://store.emkay.ai/" data-t="hub_open"></a></div>
  <div class="card"><div class="icon">🛟</div><p data-t="hub_help_p"></p>
    <a class="open small ghost" href="code/#help" data-t="hub_open"></a></div>
</div>

<footer>
  <p><a href="https://blocks.emkay.ai/">Emkay Blocks</a> ·
     <a href="https://github.com/emkay-voice/code">Emkay Code</a> ·
     <a href="https://emkay.ai/">emkay.ai</a> ·
     <a href="https://store.emkay.ai/" data-t="f_store"></a> ·
     <a href="https://github.com/emkay-voice/dev/discussions">Discussions</a></p>
  <p data-t="note"></p>
  <p data-t="f_note"></p>
</footer>
</main>
<script src="texts.js"></script>
<script>
// The page's language: ?lang=, then the one picked before (shared with
// emkay.ai and Blocks), then the browser's; English for any text a language lacks.
const LANGS = Object.keys(TEXTS);
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem("emkay-site-lang"); } catch {}
  for (const want of [q, saved, ...(navigator.languages || [navigator.language])]) {
    if (!want) continue;
    const w = want.toLowerCase();
    const hit = LANGS.find((l) => l.toLowerCase() === w) || LANGS.find((l) => l.split("-")[0] === w.split("-")[0]);
    if (hit) return hit;
  }
  return "en";
}
let lang = pickLang();
const t = (key) => TEXTS[lang][key] ?? TEXTS.en[key];
function render() {
  document.documentElement.lang = lang;
  document.title = t("hub_title");
  document.querySelector('meta[name="description"]').content = t("hub_description");
  document.querySelectorAll("[data-t]").forEach((el) => { el.innerHTML = t(el.dataset.t); });
  // Blocks and the code page in the same language
  document.getElementById("to-blocks").href = `blocks/?lang=${encodeURIComponent(lang)}`;
  document.getElementById("to-code").href = `code/?lang=${encodeURIComponent(lang)}`;
}
const picker = document.getElementById("lang");
for (const l of LANGS) picker.append(new Option(TEXTS[l]._name, l));
picker.value = lang;
picker.onchange = () => {
  lang = picker.value;
  try { localStorage.setItem("emkay-site-lang", lang); } catch {}
  render();
};
render();
</script>
</body>
</html>
